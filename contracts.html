<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Warm Up UK Homes – Contract</title>
<style>
  :root{--gold:#ffd200;--blk:#000;--border:#222;--muted:#666}
  html,body{margin:0;background:#fff}
  body{padding:16px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;color:#111}
  /* A4 container for consistent PDF output */
  #sheet{width:794px;min-height:1123px;margin:0 auto;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.06);padding:26px;box-sizing:border-box;background:#fff}
  @media (max-width:820px){#sheet{transform:scale(.92);transform-origin:top left;width:864px}}
  header{background:var(--blk);color:var(--gold);padding:14px 18px;margin:0 0 14px;font-weight:800;font-size:28px}
  .sub{font-size:13px;margin:6px 2px 16px}
  label{display:block;font-weight:700;margin:10px 0 4px}
  input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cfcfcf;border-radius:6px;font-size:15px;background:#fff;box-sizing:border-box}
  textarea{min-height:74px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .full{grid-column:1/-1}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{border:1px solid #ddd;padding:8px;vertical-align:top}
  th{background:#f6f6f6;text-align:left}
  td.actions{text-align:center}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{background:var(--blk);color:var(--gold);border:none;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}
  .btn.light{background:#f2f2f2;color:#111;border:1px solid #ddd}
  .right{text-align:right}
  .sig{border:1.5px dashed #777;border-radius:6px;height:120px;background:#fafafa;position:relative}
  .sig small{position:absolute;left:10px;top:8px;color:#777}
  .totals{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px;font-size:13px}
</style>
</head>
<body>
<div id="sheet">
  <header>Warm Up UK Homes Limited</header>
  <div class="sub"><strong>Registered Office:</strong> Fitzwilliam House, Middle Bank, Doncaster, DN4 5NG • <strong>Tel:</strong> 07470 474 774</div>

  <div class="grid">
    <div>
      <label for="clientName">Client Name:</label>
      <input id="clientName" placeholder="Enter client name">
    </div>
    <div>
      <label for="productNote">Project/Ref:</label>
      <input id="productNote" placeholder="e.g., Loft Insulation Upgrade">
    </div>
    <div class="full">
      <label for="address">Address:</label>
      <textarea id="address" placeholder="Enter property address"></textarea>
    </div>
  </div>

  <h3>Products</h3>
  <div class="btns" style="margin:6px 0">
    <button class="btn light" id="addRow">+ Add Product</button>
  </div>
  <table id="items">
    <thead>
      <tr>
        <th style="width:28%">Product</th>
        <th>Description</th>
        <th style="width:12%">Qty</th>
        <th style="width:16%">Unit £</th>
        <th style="width:16%">Line £</th>
        <th style="width:8%">—</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="grid" style="margin-top:10px">
    <div>
      <label for="vat">VAT %:</label>
      <input id="vat" type="number" min="0" step="1" value="0" oninput="recalc()">
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <input type="checkbox" id="adminFee" checked onchange="recalc()">
        <label for="adminFee" style="font-weight:600">Add £150 admin fee</label>
      </div>
    </div>
    <div class="full">
      <label for="notes">Notes:</label>
      <textarea id="notes" placeholder="Add any additional notes"></textarea>
    </div>
  </div>

  <h3>Client Signature</h3>
  <div class="sig">
    <small>Sign inside the box</small>
    <canvas id="signature" style="width:100%;height:100%"></canvas>
  </div>
  <div class="btns" style="margin-top:8px">
    <button class="btn light" id="clearSig">Clear Signature</button>
  </div>

  <h3>Totals</h3>
  <div class="totals">
    <div>Base</div>      <div class="right">£ <span id="outBase">0.00</span></div>
    <div>Admin fee</div> <div class="right">£ <span id="outAdmin">150.00</span></div>
    <div>VAT</div>       <div class="right">£ <span id="outVAT">0.00</span></div>
    <div><strong>Grand Total</strong></div><div class="right"><strong>£ <span id="outGrand">0.00</span></strong></div>
  </div>

  <div class="btns" style="justify-content:center;margin-top:16px">
    <button class="btn" id="btnPdf">Generate PDF</button>
  </div>
</div>

<!-- libs -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
/* ===== Product catalogue for dropdown ===== */
const CATALOG = [
  {name:'Loft Insulation – Fibreglass (per m²)', price:18},
  {name:'Loft Insulation – Rockwool (per m²)', price:22},
  {name:'Multifoil – YBS SuperQuilt (per m²)', price:45},
  {name:'Multifoil – TLX Silver (per m²)', price:49},
  {name:'Pitched Roof – Over Rafter (per m²)', price:65},
  {name:'Cavity Wall Insulation (per m²)', price:28},
  {name:'Spray Foam Removal (per m²)', price:55},
  {name:'Loft Boarding (per m²)', price:35},
  {name:'Ventilation / Trickle Vents (each)', price:35},
  {name:'Inspection & Report (fixed)', price:150},
  {name:'Custom Item', price:0}
];

/* ===== Build a product row ===== */
function productSelectHTML(selected=''){
  return `<select class="prod">
    ${CATALOG.map(o=>`<option value="${o.name}" ${o.name===selected?'selected':''}>${o.name}</option>`).join('')}
  </select>`;
}
function addRow(data={}){
  const tbody = document.querySelector('#items tbody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${productSelectHTML(data.product||'')}</td>
    <td><input class="desc" placeholder="Details" value="${data.desc||''}"></td>
    <td><input class="qty" type="number" min="0" step="0.01" value="${data.qty??1}"></td>
    <td><input class="unit" type="number" min="0" step="0.01" value="${data.unit??priceFor(data.product)}"></td>
    <td class="right">£ <span class="line">0.00</span></td>
    <td class="actions"><button class="btn light del">✕</button></td>
  `;
  tbody.appendChild(tr);
  // events
  tr.querySelector('.prod').addEventListener('change', e=>{
    const name = e.target.value;
    const price = priceFor(name);
    const unit = tr.querySelector('.unit');
    if (price!==null) unit.value = price;
    recalc();
  });
  tr.querySelectorAll('.qty,.unit,.desc').forEach(el=>el.addEventListener('input', recalc));
  tr.querySelector('.del').addEventListener('click', ()=>{ tr.remove(); recalc(); });
  recalc();
}
function priceFor(name){
  const f = CATALOG.find(x=>x.name===name);
  return f ? f.price : (name ? 0 : 0);
}

/* starter row */
addRow({product:CATALOG[0].name, qty:1, unit:CATALOG[0].price});
document.getElementById('addRow').addEventListener('click', ()=> addRow({product:CATALOG[0].name, qty:1, unit:CATALOG[0].price}));

/* ===== Totals ===== */
function recalc(){
  let base = 0;
  document.querySelectorAll('#items tbody tr').forEach(tr=>{
    const qty = parseFloat(tr.querySelector('.qty').value||0);
    const unit = parseFloat(tr.querySelector('.unit').value||0);
    const line = qty*unit;
    tr.querySelector('.line').textContent = (Math.round(line*100)/100).toFixed(2);
    base += line;
  });
  const admin = document.getElementById('adminFee').checked ? 150 : 0;
  const vatPct = parseFloat(document.getElementById('vat').value||0);
  const vat = (base + admin) * (vatPct/100);
  const grand = base + admin + vat;
  const f=n=>(Math.round(n*100)/100).toFixed(2);
  document.getElementById('outBase').textContent = f(base);
  document.getElementById('outAdmin').textContent = f(admin);
  document.getElementById('outVAT').textContent = f(vat);
  document.getElementById('outGrand').textContent = f(grand);
}
recalc();

/* ===== Signature Pad ===== */
(function(){
  const cvs = document.getElementById('signature');
  const ctx = cvs.getContext('2d');
  let drawing=false,last=null;
  function resize(){
    const r=cvs.getBoundingClientRect(), prev=cvs.toDataURL();
    cvs.width=r.width; cvs.height=r.height;
    if(prev){
      const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,cvs.width,cvs.height); img.src=prev;
    }
    ctx.lineWidth=2; ctx.lineJoin='round'; ctx.lineCap='round';
  }
  window.addEventListener('resize', resize); resize();
  function p(e){ if(e.touches) e=e.touches[0]; const r=cvs.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  function start(e){drawing=true;last=p(e);e.preventDefault();}
  function move(e){if(!drawing) return; const cur=p(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(cur.x,cur.y); ctx.stroke(); last=cur; e.preventDefault();}
  function end(){drawing=false; last=null;}
  cvs.addEventListener('mousedown',start); document.addEventListener('mouseup',end); cvs.addEventListener('mousemove',move);
  cvs.addEventListener('touchstart',start,{passive:false}); cvs.addEventListener('touchend',end); cvs.addEventListener('touchmove',move,{passive:false});
  document.getElementById('clearSig').onclick=()=>ctx.clearRect(0,0,cvs.width,cvs.height);
})();

/* ===== PDF generation: preserve inputs, textareas, selects, signature ===== */
document.getElementById('btnPdf').addEventListener('click', async () => {
  const { jsPDF } = window.jspdf;
  const sheet = document.getElementById('sheet');

  const canvas = await html2canvas(sheet, {
    scale: 2,
    backgroundColor:'#ffffff',
    useCORS:true,
    onclone: (doc) => {
      // 1) Inputs/Textareas: render values
      doc.querySelectorAll('input,textarea').forEach(el=>{
        const id = el.id;
        if(id){ // simple fields
          const orig = document.getElementById(id);
          if(!orig) return;
          if(el.tagName==='TEXTAREA'){
            const div = doc.createElement('div');
            div.style.whiteSpace='pre-wrap';
            div.style.padding='10px 12px';
            div.style.border='1px solid #cfcfcf'; div.style.borderRadius='6px';
            div.textContent = orig.value;
            el.replaceWith(div);
          } else {
            el.setAttribute('value', orig.type==='checkbox' ? (orig.checked?'Yes':'No') : (orig.value||''));
          }
        } else {
          // inputs inside table (qty/unit/desc)
          if(el.classList.contains('desc')){
            const div = doc.createElement('div');
            div.textContent = el.value;
            div.style.padding='10px 12px';
            el.replaceWith(div);
          } else {
            el.setAttribute('value', el.value);
          }
        }
      });
      // 2) Selects: replace with the selected option text
      doc.querySelectorAll('select').forEach(sel=>{
        const span = doc.createElement('span');
        const idx = sel.selectedIndex;
        span.textContent = idx>=0 ? sel.options[idx].text : '';
        sel.replaceWith(span);
      });
      // 3) Signature: canvas -> image
      const sigData = document.getElementById('signature').toDataURL('image/png');
      const cloneSig = doc.getElementById('signature');
      if (cloneSig && sigData){
        const img = doc.createElement('img');
        img.src = sigData; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='contain';
        cloneSig.replaceWith(img);
      }
    }
  });

  const img = canvas.toDataURL('image/png');
  const pdf = new jsPDF('p','pt','a4');
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const imgW = pageW;
  const imgH = canvas.height * imgW / canvas.width;

  let y=0, left=imgH;
  pdf.addImage(img,'PNG',0,y,imgW,imgH,'','FAST');
  left -= pageH;
  while(left>0){ y -= pageH; pdf.addPage(); pdf.addImage(img,'PNG',0,y,imgW,imgH,'','FAST'); left -= pageH; }
  pdf.save('WarmUpUK_Contract.pdf');
});
</script>
</body>
</html>
